suite: Static credential file configuration
templates:
  - configmap.yaml
tests:
  - it: omits credential-file settings by default
    documentIndex: 0
    asserts:
      - notMatchRegex:
          path: data["nico-api-config.toml"]
          pattern: '\[credentials\.file\]'

  - it: configures a mounted Secret file without rendering its contents
    documentIndex: 0
    set:
      credentials.file.existingSecret.name: ufm-credentials
      credentials.file.existingSecret.key: static-credentials.yaml
      credentials.file.mountPath: /var/run/secrets/nico/ufm
      credentials.file.pollInterval: 15s
    asserts:
      - matchRegex:
          path: data["nico-api-config.toml"]
          pattern: '(?m)^\[credentials\.file\]$'
      - matchRegex:
          path: data["nico-api-config.toml"]
          pattern: '(?m)^path = "/var/run/secrets/nico/ufm/credentials\.yaml"$'
      - matchRegex:
          path: data["nico-api-config.toml"]
          pattern: '(?m)^poll_interval = "15s"$'
      - matchRegex:
          path: data["nico-api-config.toml"]
          pattern: '(?m)^allow_legacy_ufm_fallback = true$'
      - notMatchRegex:
          path: data["nico-api-config.toml"]
          pattern: 'ufm_auth_by_fabric|token-after-rotation'

  - it: makes the local sources authoritative for UFM when requested
    documentIndex: 0
    set:
      credentials.file.existingSecret.name: ufm-credentials
      credentials.file.allowLegacyUfmFallback: false
    asserts:
      - matchRegex:
          path: data["nico-api-config.toml"]
          pattern: '(?m)^allow_legacy_ufm_fallback = false$'

  - it: rejects a missing legacy UFM fallback policy
    set:
      credentials.file.existingSecret.name: ufm-credentials
      credentials.file.allowLegacyUfmFallback: null
    asserts:
      - failedTemplate:
          errorMessage: "nico-api.credentials.file.allowLegacyUfmFallback must be a boolean when credentials.file.existingSecret.name is set"
